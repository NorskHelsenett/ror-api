    - AccessRorWrite
    - AccessRorOwner
    - AccessRorMetadataWrite
    - AccessRorVulnerabilityRead
    - AccessRorVulnerabilityWrite
    - AccessRorConfigRead
    - AccessRorConfigWrite
    - AccessKubernetesLogon
    - AccessKubernetesAdmin
    - AccessKubernetesReadonly
    - AccessKubernetesArgocdAdmin
    - AccessKubernetesArgocdProjectAdmin
    - AccessKubernetesGrafanaAdmin
    - AccessVirtualmachineDelete
  aclmodels.Acl3LookupByScopeSubjectAccessGroup:
    properties:
      access:
        $ref: '#/definitions/aclmodels.AccessTypeV3'
      group:
        type: string
      provenance:
        description: |-
          Provenance lists every resource in the tree (the queried resource and/or
          its ancestors) on which this group has this access, one entry per level.
        items:
          $ref: '#/definitions/aclmodels.Acl3LookupProvenance'
        type: array
    type: object
  aclmodels.Acl3LookupByScopeSubjectResponse:
    properties:
      accessGroups:
        items:
          $ref: '#/definitions/aclmodels.Acl3LookupByScopeSubjectAccessGroup'
        type: array
      scope:
        $ref: '#/definitions/aclscope.Scope'
      subject:
        $ref: '#/definitions/aclscope.Subject'
    type: object
  aclmodels.Acl3LookupProvenance:
    properties:
      level:
        type: integer
      scope:
        $ref: '#/definitions/aclscope.Scope'
      subject:
        $ref: '#/definitions/aclscope.Subject'
    type: object
  aclmodels.AclLookupResponse:
    properties:
      scopes:
        additionalProperties:
          $ref: '#/definitions/aclmodels.AclLookupResponseScope'
        type: object
    type: object
  aclmodels.AclLookupResponseScope:
    properties:
      subject:
        additionalProperties:
          $ref: '#/definitions/aclmodels.AclV2ListItemAccess'
        type: object
    type: object
  aclmodels.AclV2ListItem:
    properties:
      access:
        allOf:
        - $ref: '#/definitions/aclmodels.AclV2ListItemAccess'
        description: v2 access model for ror api
      created:
        type: string
      group:
        description: The group which the acces is granted
        minLength: 1
        type: string
      id:
        description: Id
        type: string
      issuedBy:
        description: expects an email
        type: string
      kubernetes:
        allOf:
        - $ref: '#/definitions/aclmodels.AclV2ListItemKubernetes'
        description: v2 access model for kubernetes
      scope:
        allOf:
        - $ref: '#/definitions/aclscope.Scope'
        description: Type of object ['cluster','project']
        minLength: 1
      subject:
        allOf:
        - $ref: '#/definitions/aclscope.Subject'
        description: The subject eg. clusterid, projectid (can be 'All')
        minLength: 1
      version:
        default: 2
        description: Acl Version, must be 2
        type: integer
    required:
    - access
    - group
    - scope
    - subject
    type: object
  aclmodels.AclV2ListItemAccess:
    properties:
      create:
        description: Write metadata of subject
        type: boolean
      delete:
        description: Delete metadata of subject
        type: boolean
      kuberneteslogon:
        description: Logon to cluster
        type: boolean
      owner:
        description: Delete metadata of subject
        type: boolean
      read:
        description: Read metadata of subject
        type: boolean
      update:
        description: Update metadata of subject
        type: boolean
    type: object
  aclmodels.AclV2ListItemKubernetes:
    properties:
      logon:
        description: Logon to subject if 'cluster'
        type: boolean
    type: object
  aclmodels.AclV3ListItem:
    properties:
      access:
        items:
          $ref: '#/definitions/aclmodels.AccessTypeV3'
        type: array
      created:
        type: string
      group:
        minLength: 1
        type: string
      id:
        type: string
      issuedBy:
        type: string
      scope:
        allOf:
        - $ref: '#/definitions/aclscope.Scope'
        minLength: 1
      subject:
        allOf:
        - $ref: '#/definitions/aclscope.Subject'
        minLength: 1
      version:
